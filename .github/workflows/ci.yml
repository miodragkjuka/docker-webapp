name: CI/CD

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Create .env for the test
        run: echo "DB_PASSWORD=ci-test-password" > .env

      - name: Build and start the containers
        run: docker compose up -d --build

      - name: Test that the app responds
        run: |
          for i in $(seq 1 15); do
            if curl -fs localhost:5000 | grep -q "Hello from Docker"; then
              echo "App is up and responding"
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Stop the containers
        if: always()
        run: docker compose down -v

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2 over SSH
        env:
          KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/ec2-key.pem \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cd ~/docker-webapp && git pull && docker compose up -d --build"
